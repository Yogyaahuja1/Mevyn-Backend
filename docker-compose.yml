version: "3.8"

services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017
      - DB_NAME=mevyn
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
      - JWT_EXPIRES_IN=7d
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-admin@mevyn.com}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-changeme123}
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
